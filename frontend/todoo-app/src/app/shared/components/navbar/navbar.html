<header class="navbar">
  <a class="brand" routerLink="/teams">
    <span class="brand-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M9 11l3 3L22 4" />
        <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
      </svg>
    </span>
    <span class="brand-text">To<span class="brand-accent">Doo</span></span>
  </a>

  <nav class="nav-links">
    <a routerLink="/teams" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Takımlarım
    </a>
  </nav>

  <div class="nav-actions">
    <span class="user-email">{{ user?.email }}</span>
    <button type="button" class="logout-btn" (click)="logout()">Çıkış</button>
  </div>
</header>
