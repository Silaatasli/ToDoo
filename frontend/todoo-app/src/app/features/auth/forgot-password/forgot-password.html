<main class="auth-page">
  <section class="auth-card">
    <div class="brand">
      <div class="brand-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11" />
        </svg>
      </div>
      <div class="brand-text">To<span class="brand-accent">Doo</span></div>
    </div>

    <p class="subtitle">Şifreni sıfırla</p>

    <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>E-posta</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="email"
          placeholder="Kayıtlı e-posta adresin"
        />
      </label>

      @if (error()) {
        <p class="error-box">{{ error() }}</p>
      }

      @if (success()) {
        <p class="success-box">{{ success() }}</p>
      }

      <button class="submit-btn" type="submit" [disabled]="loading() || !!success()">
        {{ loading() ? 'Gönderiliyor...' : 'Sıfırlama linki gönder' }}
      </button>
    </form>

    <p class="footer-link">
      <a routerLink="/login">Giriş sayfasına dön</a>
    </p>
  </section>
</main>
